version: '3.8'

# ==========================================
# Configuration pour VPS avec PostgreSQL NATIF
# Le backend utilise network_mode: host pour accéder à localhost:5432
# ==========================================

services:
  # ==========================================
  # Backend Spring Boot (Mode Host pour accès BDD native)
  # ==========================================
  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: Link2Act-backend
    restart: unless-stopped
    network_mode: "host"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/solidedb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Fadema@@imi@@
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: false
      SERVER_PORT: 8080
      JAVA_OPTS: "-Xmx512m -Xms256m"
      # Configuration Email
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: kouzoudmohemad@gmail.com
      SPRING_MAIL_PASSWORD: "wpad sggu ychg bfsi"
      APP_FRONTEND_URL: https://link2act.cloud
      # JWT
      APPLICATION_SECURITY_JWT_SECRET_KEY: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      APPLICATION_SECURITY_JWT_EXPIRATION: 86400000
      # Admin
      APP_ADMIN_EMAIL: admin1@Link2Act.com
      APP_ADMIN_PASSWORD: admin123
    volumes:
      - /var/www/solidarlink/back/uploads:/app/uploads
      - ./back/logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==========================================
  # Frontend React + Nginx
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: Link2Act-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: http://localhost:8080
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - Link2Act-network

# ==========================================
# Réseau Docker (seulement pour frontend)
# ==========================================
networks:
  Link2Act-network:
    driver: bridge
