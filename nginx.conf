server {
    listen 80;
    server_name _;

    # 1. FRONTEND REACT
    root /var/www/solidarlink/frontend/dist;
    index index.html;

    # SPA Routing - toutes les routes vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. BACKEND API (Spring Boot sur port 8080)
    location /api/ {
        proxy_pass http://localhost:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # SSE (Server-Sent Events) pour notifications en temps réel
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding on;
    }

    # 3. UPLOADS - Servir les images/fichiers uploadés
    location /uploads/ {
        alias /var/www/solidarlink/back/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 4. Cache des assets statiques (JS, CSS, images du frontend)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 5. Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
